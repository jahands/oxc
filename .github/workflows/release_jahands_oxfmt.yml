# JHPATCH: Builds the fork's oxfmt for upstream's targets and publishes it to npm as `@jahands/oxfmt`
name: Release @jahands/oxfmt

permissions: {}

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish: <upstream oxfmt version>-jh.<n>, e.g. 0.73.0-jh.1"
        required: true
        type: string
      dry_run:
        description: "Build everything and run `npm publish --dry-run` instead of publishing"
        required: true
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  VERSION: ${{ inputs.version }}

jobs:
  check:
    if: github.repository == 'uuid-rocks/oxc'
    name: Check version
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - uses: taiki-e/checkout-action@7d1e50e93dc4fb3bba58f85018fadf77898aee8b # v1.4.2

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - run: node .github/scripts/jahands-oxfmt-prepare.mjs "$VERSION"

  build:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: blacksmith-8vcpu-windows-2025
            target: x86_64-pc-windows-msvc
            build: pnpm run build-napi-release --target x86_64-pc-windows-msvc

          - os: blacksmith-8vcpu-windows-2025
            target: aarch64-pc-windows-msvc
            build: pnpm run build-napi-release --target aarch64-pc-windows-msvc

          - os: blacksmith-8vcpu-windows-2025
            target: i686-pc-windows-msvc
            build: pnpm run build-napi-release --target i686-pc-windows-msvc

          - os: blacksmith-8vcpu-ubuntu-2404
            target: x86_64-unknown-linux-gnu
            build: pnpm run build-napi-release --target x86_64-unknown-linux-gnu --use-napi-cross

          - os: blacksmith-8vcpu-ubuntu-2404
            target: aarch64-unknown-linux-gnu
            build: pnpm run build-napi-release --target aarch64-unknown-linux-gnu --use-napi-cross

          - os: blacksmith-8vcpu-ubuntu-2404
            target: armv7-unknown-linux-gnueabihf
            build: pnpm run build-napi-release --target armv7-unknown-linux-gnueabihf --use-napi-cross

          - os: blacksmith-8vcpu-ubuntu-2404
            target: x86_64-unknown-linux-musl
            build: pnpm run build-napi-release --target x86_64-unknown-linux-musl -x

          - os: blacksmith-8vcpu-ubuntu-2404
            target: aarch64-unknown-linux-musl
            build: pnpm run build-napi-release --target aarch64-unknown-linux-musl -x

          - os: blacksmith-8vcpu-ubuntu-2404
            target: armv7-unknown-linux-musleabihf
            build: pnpm run build-napi-release --target armv7-unknown-linux-musleabihf -x

          - os: blacksmith-12vcpu-macos-latest
            target: x86_64-apple-darwin
            build: pnpm run build-napi-release --target x86_64-apple-darwin

          - os: blacksmith-12vcpu-macos-latest
            target: aarch64-apple-darwin
            build: pnpm run build-napi-release --target aarch64-apple-darwin

          - os: blacksmith-8vcpu-ubuntu-2404
            target: aarch64-linux-android
            build: pnpm run build-napi-release --target aarch64-linux-android

          - os: blacksmith-8vcpu-ubuntu-2404
            target: armv7-linux-androideabi
            build: pnpm run build-napi-release --target armv7-linux-androideabi

          - os: blacksmith-8vcpu-ubuntu-2404
            target: aarch64-unknown-linux-ohos
            build: pnpm run build-napi-release --target aarch64-unknown-linux-ohos

          - os: blacksmith-8vcpu-ubuntu-2404
            target: powerpc64le-unknown-linux-gnu
            build: pnpm run build-napi-release --target powerpc64le-unknown-linux-gnu --use-napi-cross

          - os: blacksmith-8vcpu-ubuntu-2404
            target: riscv64gc-unknown-linux-gnu
            build: |
              sudo apt-get update
              sudo apt-get install gcc-riscv64-linux-gnu g++-riscv64-linux-gnu -y
              export TARGET_CC=riscv64-linux-gnu-gcc
              export CXX=riscv64-linux-gnu-g++
              pnpm run build-napi-release --target riscv64gc-unknown-linux-gnu

          - os: blacksmith-8vcpu-ubuntu-2404
            target: riscv64gc-unknown-linux-musl
            build: pnpm run build-napi-release --target riscv64gc-unknown-linux-musl -x

          - os: blacksmith-8vcpu-ubuntu-2404
            target: s390x-unknown-linux-gnu
            build: export CFLAGS="-fuse-ld=lld" && pnpm run build-napi-release --target s390x-unknown-linux-gnu --use-napi-cross

    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    env:
      # `clang` lacks the MSVC intrinsics that mimalloc uses on ARM64 MSVC, so cc-rs picks `cl.exe` there.
      TARGET_CC: ${{ !contains(matrix.target, 'pc-windows-msvc') && 'clang' || '' }} # for mimalloc
    defaults:
      run:
        shell: bash
    steps:
      - if: ${{ contains(matrix.os, 'windows') }}
        run: git config --system core.longpaths true

      - uses: taiki-e/checkout-action@7d1e50e93dc4fb3bba58f85018fadf77898aee8b # v1.4.2

      - uses: oxc-project/setup-node@f46a72f95efdc55273fcd042d61c84e723b2892c # v1.4.1

      # For cargo-zigbuild in musl builds.
      - if: ${{ contains(matrix.target, 'musl') }}
        uses: goto-bus-stop/setup-zig@abea47f85e598557f500fa1fd2ab7464fcb39406 # v2.2.1
        with:
          version: 0.13.0

      - if: ${{ contains(matrix.target, 'ohos') }}
        uses: Boshen/setup-ohos-sdk@edb865a89a712f1f15dbad932dfa9cfce849d95c # v1.0.0

      - run: rustup target add ${{ matrix.target }}

      # Sets the Cargo package version, which `oxfmt --version` prints.
      - run: node .github/scripts/jahands-oxfmt-prepare.mjs "$VERSION"

      - working-directory: apps/oxfmt
        run: ${{ matrix.build }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          if-no-files-found: error
          name: oxfmt-bindings-${{ matrix.target }}
          path: apps/oxfmt/src-js/*.node

  build-freebsd:
    needs: check
    name: Build x86_64-unknown-freebsd
    runs-on: blacksmith-8vcpu-ubuntu-2404
    steps:
      - uses: taiki-e/checkout-action@7d1e50e93dc4fb3bba58f85018fadf77898aee8b # v1.4.2

      - uses: oxc-project/setup-node@f46a72f95efdc55273fcd042d61c84e723b2892c # v1.4.1

      - run: rustup target add x86_64-unknown-freebsd

      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: "0.15.2"

      - uses: jaxxstorm/action-install-gh-release@25e24d2d23ae098373794ef1d6faecb48ee52da8 # v3.0.0
        with:
          repo: rust-cross/cargo-zigbuild

      - run: node .github/scripts/jahands-oxfmt-prepare.mjs "$VERSION"

      - working-directory: apps/oxfmt
        run: pnpm run build-napi-release --target x86_64-unknown-freebsd -x

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          if-no-files-found: error
          name: oxfmt-bindings-x86_64-unknown-freebsd
          path: apps/oxfmt/src-js/*.node

  publish:
    name: Publish
    needs: [build, build-freebsd]
    # npm trusted publishing and provenance require a GitHub-hosted runner.
    runs-on: ubuntu-latest
    permissions:
      id-token: write # npm trusted publishing and provenance
    env:
      package_path: npm/oxfmt
      npm_dir: npm/oxfmt-release
    steps:
      - uses: taiki-e/checkout-action@7d1e50e93dc4fb3bba58f85018fadf77898aee8b # v1.4.2

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
          pattern: oxfmt-bindings-*

      - uses: oxc-project/setup-node@f46a72f95efdc55273fcd042d61c84e723b2892c # v1.4.1

      # Renames the packages in `npm/oxfmt/package.json` and the binding names in the napi loader before bundling.
      - run: node .github/scripts/jahands-oxfmt-prepare.mjs "$VERSION"

      - working-directory: apps/oxfmt
        run: pnpm run build-js

      - run: |
          mkdir -p "${npm_dir}"
          pnpm napi create-npm-dirs --package-json-path "${package_path}/package.json" --npm-dir "${npm_dir}"
          pnpm napi artifacts --package-json-path "${package_path}/package.json" --build-output-dir apps/oxfmt/src-js --npm-dir "${npm_dir}"
          cp -r apps/oxfmt/dist "${package_path}/dist"

      # Adds the platform packages to `optionalDependencies` of the main package.
      - run: |
          pnpm napi pre-publish --skip-optional-publish --no-gh-release -t npm --package-json-path "${package_path}/package.json" --npm-dir "${npm_dir}"
          cat "${package_path}/package.json"

      - name: Publish
        env:
          # npm tries trusted publishing (OIDC) first and falls back to this token.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          npm --version
          flags=(--access public --tag latest --provenance)
          if [ "$DRY_RUN" != "false" ]; then flags+=(--dry-run); fi

          publish() {
            local name
            name=$(node -p "require('./$1/package.json').name")
            if [ "$(npm view "$name@$VERSION" version 2>/dev/null)" = "$VERSION" ]; then
              echo "$name@$VERSION is already published, skipping."
              return
            fi
            npm publish "./$1" "${flags[@]}"
          }

          for dir in "${npm_dir}"/*; do
            publish "$dir"
          done

          # npm publish can finish before package metadata and tarballs are available.
          if [ "$DRY_RUN" = "false" ]; then
            node .github/scripts/wait-for-npm-packages.mjs "${npm_dir}"/*
          fi

          publish "${package_path}"
