[package]
name = "sort-package-json"
version = "1.0.0"
authors = ["Boshen <boshenc@gmail.com>"]
categories = ["development-tools"]
edition = "2021"
include = ["/src", "/benches", "/examples", "/tests", "/CHANGELOG.md", "/LICENSE", "/README.md"]
keywords = ["formatter", "json", "npm", "package-json", "sort"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/oxc-project/sort-package-json"
rust-version = "1.76"
description = "Sort package.json files according to established npm conventions"
publish = false

[lints.rust]
absolute_paths_not_starting_with_crate = "warn"
non_ascii_idents = "warn"
unit_bindings = "warn"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage)', 'cfg(coverage_nightly)'] }

[lints.clippy]
all = { level = "warn", priority = -1 }
# restriction
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
print_stdout = "warn" # Must be opt-in
print_stderr = "warn" # Must be opt-in
allow_attributes = "warn"
# I like the explicitness of this rule as it removes confusion around `clone`.
# This increases readability, avoids `clone` mindlessly and heap allocating by accident.
clone_on_ref_ptr = "warn"
# These two are mutually exclusive, I like `mod.rs` files for better fuzzy searches on module entries.
self_named_module_files = "warn" # "-Wclippy::mod_module_files"
empty_drop = "warn"
empty_structs_with_brackets = "warn"
exit = "warn"
filetype_is_file = "warn"
get_unwrap = "warn"
impl_trait_in_params = "warn"
rc_buffer = "warn"
rc_mutex = "warn"
rest_pat_in_fully_bound_structs = "warn"
unnecessary_safety_comment = "warn"
undocumented_unsafe_blocks = "warn"
infinite_loop = "warn"

[dependencies]
serde = "1.0"
serde_json = "1.0"

[dev-dependencies]
criterion2 = { version = "3", default-features = false }
ignore = "0.4"
insta = "1.41"

[[bench]]
name = "sort"
harness = false

[features]
codspeed = ["criterion2/codspeed"]
